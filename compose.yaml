services:
  mongo-replica-1:
    hostname: mongo-replica-1
    container_name: mongo-replica-1
    image: mongo:5.0.26
    command: mongod --replSet rs --journal --bind_ip_all
    ports:
      - "27018:27017"
    restart: always
    networks:
      - mongo-net
  mongo-replica-2:
    hostname: mongo-replica-2
    container_name: mongo-replica-2
    image: mongo:5.0.26
    command: mongod --replSet rs --journal --bind_ip_all
    ports:
      - "27019:27017"
    restart: always
    networks:
      - mongo-net

  mongo-primary:
    hostname: mongo-primary
    container_name: mongo-primary
    depends_on:
      - mongo-replica-1
      - mongo-replica-2
    image: mongo:5.0.26
    command: mongod --replSet rs --journal --bind_ip_all
    ports:
      - "27017:27017"
    links:
      - mongo-replica-1
      - mongo-replica-2
    restart: always
    networks:
      - mongo-net
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs',members:[{_id:0,host:\"mongo-primary:27017\",priority:2},{_id:1,host:\"mongo-replica-1:27017\",priority:0},{_id:2,host:\"mongo-replica-2:27017\",priority:0}]}).ok || rs.status().ok" | mongo --port 27017 --quiet) -eq 1
      interval: 10s
      start_period: 30s
    volumes:
      - ./src/main/resources/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  postgres-db:
    image: postgres:18-alpine3.24
    container_name: postgres-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: productDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: S3cret
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d productDB" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: pgadmin
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: S3cret
      # Skip the "new server" wizard: productDB is pre-registered from servers.json.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass.ro:ro
      - pgadmin-data:/var/lib/pgadmin
    # libpq silently ignores a passfile that is group- or world-readable, and a bind
    # mount keeps the host's permissions, so install a 0600 copy before pgAdmin starts.
    entrypoint: [ "/bin/sh", "-c", "install -m 600 /pgpass.ro /var/lib/pgadmin/pgpass && exec /entrypoint.sh" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/misc/ping')\"" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgadmin-data:

networks:
  mongo-net:
    name: mongo-net



